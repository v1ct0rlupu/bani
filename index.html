<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6200">
<title>Investește în viitor</title>
<style>
:root{--or:#ff6200;--or2:#e55800;--or-soft:#fff3eb;--bg:#f3f3f3;--ink:#1d1d1b;--mute:#6f6f6f;--line:#e2e2e2;--green:#0a8a4f;--green-bg:#e8f6ef;--red:#d6293e;--red-bg:#fceaea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0))}
.top{background:var(--or);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.top button{width:auto;background:none;border:1px solid #fff9;color:#fff;padding:6px 12px;border-radius:99px;margin:0;font-size:.85rem}
.pad{padding:16px}
.bal{background:var(--or);color:#fff;padding:6px 18px 26px;border-radius:0 0 26px 26px}
.bal small{opacity:.85;display:block}.bal .n{font-size:2.5rem;font-weight:800}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0000000d}
.card h3{margin:0 0 8px;font-size:1rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or);border-radius:99px}
.mute{color:var(--mute);font-size:.88rem}
button,.btn{font:inherit;display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:13px 14px;margin-top:9px;cursor:pointer;text-decoration:none}
button:hover,button:focus-visible,.btn:hover{border-color:var(--or);outline:2px solid var(--or);outline-offset:2px}
button.p,.btn.p{background:var(--or);border-color:var(--or);color:#fff;text-align:center;font-weight:700}
button.ghost{text-align:center}
button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;margin-top:9px;background:#fff}
input:focus,select:focus{border-color:var(--or);outline:none}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:40}
.nav a{flex:1;text-align:center;padding:12px 0 10px;font-weight:600;color:var(--mute);font-size:.7rem;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav a.on{color:var(--or);box-shadow:inset 0 3px var(--or)}
.nav svg{width:20px;height:20px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff;background:var(--green)}.tag.bad{background:var(--red)}
.err{color:var(--red);font-size:.9rem;margin-top:8px}
.login{padding:36px 22px 100px}.login h1{margin:0 0 6px;color:var(--or);font-size:2rem;line-height:1.1}
.logo-mark{width:56px;height:56px;border-radius:16px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem;margin-bottom:14px}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border:0}
.lb-rank{width:28px;height:28px;border-radius:50%;background:var(--or-soft);color:var(--or);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.lb-rank.top{background:var(--or);color:#fff}
.lb-info{flex:1;min-width:0}.lb-info b{display:block}.lb-score{font-weight:800;white-space:nowrap}
.me{background:var(--or-soft);border-radius:10px;padding-left:6px;padding-right:6px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.show{opacity:1}
label.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem}
label.chk input{width:auto;margin:0}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--or-soft);border-radius:12px;padding:14px;text-align:center}
.stat .n{font-size:1.5rem;font-weight:800;color:var(--or2)}.stat .l{font-size:.75rem;color:var(--mute)}
.note{background:var(--or-soft);border-radius:12px;padding:12px 14px;font-size:.85rem;color:var(--or2);margin:12px 0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;text-align:center;margin:0;padding:10px;font-weight:600}
.tabs button.on{background:var(--or);border-color:var(--or);color:#fff}
.art p,.art li{font-size:.95rem}.art h4{margin:14px 0 4px;color:var(--or2)}
.fx{background:var(--or-soft);border-radius:10px;padding:10px 12px;font-weight:700;color:var(--or2);margin:8px 0}
.opt{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:9px;cursor:pointer;background:#fff}
.opt input{width:auto;margin:0 8px 0 0;accent-color:var(--or)}
.opt.sel{border-color:var(--or);background:var(--or-soft)}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.timer{display:flex;justify-content:space-between;align-items:center;background:var(--or);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px}
.timer .t{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}.timer .t.low{color:#ffe0e0}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.dots button{width:34px;margin:0;padding:6px 0;text-align:center;font-size:.8rem}
.dots button.done{background:var(--or-soft);border-color:var(--or)}.dots button.cur{background:var(--or);color:#fff;border-color:var(--or)}
.row2{display:flex;gap:8px}.row2>*{flex:1}
</style>
</head>

<script>

const UNLOCK_DAYS=0, FIN_MIN=40, DAY=864e5;
const FB=FIREBASE_URL.replace(/\/$/,'');

const LESSONS=[
{id:'buget',t:'Bugetul personal',s:'Cum îți planifici banii ca să ajungă.',
b:`<p>Un <b>buget</b> este un plan al banilor pe o lună: cât intră (<b>venituri</b>) și pe ce ies (<b>cheltuieli</b>). Nu e o listă de interdicții, ci un instrument care îți arată unde merg banii.</p>
<h4>Tipuri de cheltuieli</h4><ul><li><b>Fixe</b>: aceeași sumă lunar (chirie, abonament transport, rata).</li><li><b>Variabile</b>: se schimbă (mâncare, haine, ieșiri).</li></ul>
<h4>Trei rezultate</h4><ul><li><b>Excedent</b>: venituri &gt; cheltuieli → economii.</li><li><b>Echilibru</b>: venituri = cheltuieli.</li><li><b>Deficit</b>: cheltuieli &gt; venituri → semnal de alarmă.</li></ul>
<h4>Regula 50 / 30 / 20</h4><div class="fx">50% nevoi · 30% dorințe · 20% economii</div><p>La 3.000 lei net: 1.500 nevoi, 900 dorințe, 600 economii.</p>
<h4>Pași</h4><p>Notează veniturile, urmărește cheltuielile o lună, împarte-le pe categorii, stabilește limite și o sumă de economii, apoi compară planul cu realitatea.</p>`,
q:[["Ce este un buget personal?","Un plan al veniturilor și cheltuielilor pe o perioadă","Suma de bani din contul bancar","Lista lucrurilor pe care vrei să le cumperi","Un împrumut de la bancă","Bugetul planifică atât intrările, cât și ieșirile de bani."],
["Chiria plătită lunar, aceeași sumă, este o cheltuială…","fixă","variabilă","opțională","neprevăzută","O sumă constantă lunar este cheltuială fixă."],
["Venituri 2.500 lei, cheltuieli 2.700 lei. Ce ai?","Deficit de 200 lei","Excedent de 200 lei","Buget echilibrat","Deficit de 2.700 lei","Cheltuielile depășesc veniturile cu 200 lei."],
["După regula 50/30/20, la un venit net de 4.000 lei, cât merge la dorințe?","1.200 lei","800 lei","2.000 lei","1.000 lei","30% din 4.000 = 1.200 lei."],
["Ai un excedent de 300 lei. Cea mai înțeleaptă folosire?","Îl muți în economii sau fondul de urgență","Îl cheltui repede","Îl lași necontabilizat","Cumperi ceva la reducere, chiar dacă nu-ți trebuie","Excedentul pus deoparte îți dă siguranță financiară."]]},
{id:'nevoi',t:'Nevoi și dorințe',s:'Diferența dintre ce îți trebuie și ce îți dorești.',
b:`<p><b>Nevoile</b> sunt lucrurile fără de care nu funcționezi normal: hrană, locuință, utilități, haine potrivite, sănătate, transport la școală. <b>Dorințele</b> îți fac viața plăcută, dar poți trăi fără ele: un telefon nou când al tău merge, haine de firmă, streaming.</p>
<div class="fx">Granița depinde de context: un laptop e dorință dacă ai deja unul care merge.</div>
<h4>Costul de oportunitate</h4><p>Când alegi ceva, renunți la altceva. Costul de oportunitate este cea mai bună alternativă la care renunți.</p>
<h4>Capcane</h4><ul><li><b>Urgența artificială</b>: „doar azi”.</li><li><b>Presiunea grupului</b>: „toți au”.</li><li><b>Costuri mici repetate</b>: 35 lei/lună = 420 lei/an.</li></ul>
<h4>Regula de 48 de ore</h4><p>Amână orice cumpărătură neplanificată două zile. Dacă încă o vrei, o treci în buget.</p>`,
q:[["Telefonul tău merge bine, dar a apărut un model nou. Cumpărarea lui este…","o dorință","o nevoie","o investiție","o cheltuială fixă","Telefonul actual își face treaba, deci cel nou e o dorință."],
["Care dintre următoarele este o nevoie?","Abonamentul de transport pentru a ajunge la școală","Un abonament de streaming","Ieșirea la pizza cu prietenii","O geacă de firmă când ai deja una bună","Transportul la școală e necesar."],
["Ce este costul de oportunitate?","Cea mai bună alternativă la care renunți când alegi ceva","Prețul de la reducere","Taxa plătită la bancă","Diferența dintre preț și TVA","Orice alegere înseamnă renunțarea la altă variantă."],
["„Ofertă valabilă doar 2 ore!” Ce urmărește mesajul?","Să te grăbească să cumperi fără să cântărești","Să te informeze despre stoc","Să te ajute să economisești","Să-ți arate că produsul e de calitate","Urgența artificială scurtează timpul de gândire."],
["Ce spune regula de 48 de ore?","Amâni o cumpărătură neplanificată două zile înainte să decizi","Returnezi produsele în 48 de ore","Cumperi doar în weekend","Plătești facturile în 48 de ore","Amânarea scade cumpărăturile impulsive."]]},
{id:'economii',t:'Economiile',s:'Cum pui bani deoparte și de ce contează fondul de urgență.',
b:`<p><b>Economiile</b> sunt partea din venit pe care nu o cheltui acum. Cea mai bună metodă: <b>plătește-te pe tine primul</b>. Când primești banii, muți imediat economia într-un cont separat, abia apoi cheltui restul.</p>
<h4>Fondul de urgență</h4><p>Rezervă pentru neprevăzut (reparații, probleme medicale). Se recomandă <b>3–6 luni de cheltuieli esențiale</b>, într-un loc ușor de accesat și sigur.</p>
<h4>Obiective SMART</h4><p>Specifice, Măsurabile, Accesibile, Relevante, încadrate în Timp. Exemplu: „Strâng 1.200 lei pentru o bicicletă până la 1 iunie, câte 200 lei pe lună”.</p>
<h4>Sumele mici contează</h4><p>10 lei pe zi = aproximativ 300 lei pe lună și 3.650 lei pe an.</p>
<h4>De ce nu „sub saltea”?</h4><p>Pot fi pierduți sau furați, iar <b>inflația</b> le scade puterea de cumpărare.</p>`,
q:[["La ce folosește fondul de urgență?","La cheltuieli neprevăzute, ca o reparație sau o problemă medicală","La vacanța de vară","La cumpărături la reducere","La investiții în acțiuni","Te protejează fără să te împrumuți."],
["Cât de mare se recomandă să fie fondul de urgență?","3–6 luni de cheltuieli esențiale","O săptămână de cheltuieli","Un salariu pe an","Cât valorează telefonul tău","Recomandarea uzuală este 3–6 luni."],
["Ce înseamnă „plătește-te pe tine primul”?","Pui deoparte economia imediat ce primești banii","Îți cumperi întâi ce îți dorești","Îți plătești întâi datoriile prietenilor","Economisești ce rămâne la final de lună","Economia se face la început, nu din rest."],
["Dacă pui deoparte 20 lei pe zi, cât strângi în 30 de zile?","600 lei","200 lei","6.000 lei","620 lei","20 × 30 = 600 lei."],
["Care obiectiv este SMART?","Strâng 900 lei pentru o tabără până în iulie, câte 150 lei pe lună","Vreau să am mulți bani","Economisesc când pot","Anul ăsta o să fiu mai atent cu banii","Are sumă, scop, termen și plan lunar."]]},
{id:'dobanda',t:'Dobânda',s:'Prețul banilor: simplă, compusă și inflația.',
b:`<p><b>Dobânda</b> este prețul folosirii banilor. Când economisești, banca îți plătește ție dobândă; când te împrumuți, tu plătești băncii.</p>
<h4>Dobânda simplă</h4><div class="fx">Dobândă = Capital × rată × ani</div><p>2.000 lei, 5%, 3 ani → 300 lei dobândă.</p>
<h4>Dobânda compusă</h4><div class="fx">Sumă finală = Capital × (1 + rată)^ani</div><p>1.000 lei la 10%: 1.100 → 1.210 → 1.331. Cu dobândă simplă ai fi avut 1.300. Cine începe mai devreme câștigă mai mult.</p>
<h4>Regula lui 72</h4><div class="fx">Ani până la dublare ≈ 72 ÷ rata (%)</div><p>La 8% → 9 ani.</p>
<h4>Dobânda reală</h4><div class="fx">Rata reală ≈ dobândă − inflație</div><p>Depozit 6%, inflație 8% → −2%: suma crește, dar puterea de cumpărare scade.</p>`,
q:[["1.000 lei la 5% dobândă simplă, 2 ani. Câtă dobândă primești?","100 lei","50 lei","102,50 lei","1.100 lei","1.000 × 0,05 × 2 = 100 lei."],
["1.000 lei la 10% dobândă compusă anual, 2 ani. Suma finală?","1.210 lei","1.200 lei","1.100 lei","1.020 lei","1.000 × 1,1 × 1,1 = 1.210 lei."],
["După regula lui 72, în cât timp se dublează banii la 8% pe an?","Aproximativ 9 ani","Aproximativ 8 ani","Aproximativ 12 ani","Aproximativ 72 de ani","72 ÷ 8 = 9 ani."],
["Ce înseamnă capitalizarea dobânzii?","Dobânda se adaugă la capital și produce la rândul ei dobândă","Banca îți ia un comision","Dobânda se plătește în numerar","Dobânda scade în timp","Apare „dobânda la dobândă”."],
["Dobândă 4%, inflație 10%. Ce se întâmplă cu puterea de cumpărare?","Scade, rata reală e aproximativ −6%","Crește cu 4%","Crește cu 14%","Rămâne la fel","4% − 10% ≈ −6%."]]},
{id:'credit',t:'Creditul',s:'Cum funcționează împrumuturile și cât costă de fapt.',
b:`<p>Un <b>credit</b> e un împrumut: primești bani acum și îi returnezi în timp, plus dobândă și comisioane.</p>
<h4>Cuvinte-cheie</h4><ul><li><b>Principal</b>: suma împrumutată.</li><li><b>Rata lunară</b>: suma plătită în fiecare lună.</li><li><b>DAE</b>: costul total anual (dobândă + comisioane). Cel mai bun indicator pentru a compara oferte.</li></ul>
<div class="fx">Cost total = rata × nr. rate − suma împrumutată</div><p>10.000 lei, 12 rate de 950 lei → returnezi 11.400 lei; creditul costă 1.400 lei.</p>
<h4>Cardul de credit</h4><p>Dacă returnezi integral până la scadență, nu plătești dobândă. Dacă plătești doar suma minimă, restul produce dobândă mare.</p>
<h4>Istoricul de credit</h4><p>Întârzierile repetate îți strică istoricul (Biroul de Credit) și creditele viitoare devin mai greu de obținut sau mai scumpe.</p>`,
q:[["Ce include DAE?","Dobânda și comisioanele, exprimate anual","Doar dobânda","Doar comisioanele","Rata lunară","DAE arată costul total al creditului."],
["Împrumuți 5.000 lei și returnezi în total 5.900 lei. Cât te-a costat creditul?","900 lei","5.900 lei","590 lei","18%","5.900 − 5.000 = 900 lei."],
["Ce se întâmplă dacă la cardul de credit plătești doar suma minimă?","Restul datoriei produce dobândă și datoria poate crește","Nu plătești dobândă","Banca îți anulează datoria","Primești bonus de fidelitate","Perioada de grație merge doar la plată integrală."],
["Cum te afectează întârzierile repetate la plata ratelor?","Îți strică istoricul și creditele viitoare sunt mai greu de obținut","Nu au niciun efect","Îți scad dobânda","Primești automat o amânare","Întârzierile apar în istoricul tău."],
["Ai două oferte de credit. După ce indicator le compari cel mai corect?","DAE","Doar dobânda nominală","Culoarea cardului","Numărul de agenții ale băncii","DAE include toate costurile."]]},
{id:'investitii',t:'Investițiile',s:'Risc, randament, diversificare și capcane.',
b:`<p>A <b>investi</b> înseamnă a pune bani într-un activ sperând la câștig. Spre deosebire de economisire, valoarea poate și să scadă. Regula de bază: <b>randament potențial mai mare = risc mai mare</b>.</p>
<h4>Instrumente</h4><ul><li><b>Depozit</b>: risc mic, randament mic.</li><li><b>Titluri de stat</b> (Tezaur, Fidelis): risc scăzut.</li><li><b>Obligațiuni</b>: împrumuți un emitent, primești dobândă.</li><li><b>Acțiuni</b>: deții o parte dintr-o companie; risc mai mare.</li><li><b>Fonduri/ETF-uri</b>: un „coș” de active.</li></ul>
<h4>Diversificarea</h4><p>„Nu pune toate ouăle în același coș.” Reduce riscul, dar nu îl elimină.</p>
<h4>Înainte să investești</h4><p>Ai buget, fond de urgență și datoriile scumpe achitate; investești doar bani de care nu ai nevoie curând.</p>
<h4>Semnale de înșelătorie</h4><p>Câștiguri „garantate” foarte mari, presiune să decizi repede, recompense dacă aduci prieteni, firme neautorizate de ASF.</p>`,
q:[["Ce înseamnă diversificarea?","Împarți banii între mai multe investiții diferite pentru a reduce riscul","Pui toți banii în cea mai bună acțiune","Schimbi des banca","Investești doar în depozite","Limitează impactul unei singure investiții proaste."],
["Ce cumperi când cumperi o acțiune?","O parte din proprietatea unei companii","Un împrumut acordat companiei","Un depozit bancar","O poliță de asigurare","Acționarul deține o fracțiune din companie."],
["Ce este o obligațiune?","Un împrumut acordat emitentului, pentru care primești dobândă","O parte dintr-o companie","O monedă digitală","Un cont curent","Împrumuți bani unei companii sau unui stat."],
["O firmă îți promite 30% câștig garantat pe lună. Ce faci?","Suspectezi o înșelătorie și verifici dacă e autorizată","Investești tot imediat","Te împrumuți ca să investești mai mult","Îi chemi și pe prieteni","Randamentele mari garantate sunt semn clasic de fraudă."],
["Ce relație există, de obicei, între risc și randament?","Randament potențial mai mare vine cu risc mai mare","Randament mare înseamnă risc zero","Nu au nicio legătură","Riscul mare garantează câștigul","Regula de bază a investițiilor."]]}
];

const ICO={
 home:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1v-9.5z"/><path d="M9 21V12h6v9"/>',
 book:'<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/>',
 fin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
 lb:'<path d="M8 21h8M12 17v4M6 4h12v5a6 6 0 01-12 0V4z"/>',
 me:'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICO[k]}</svg>`;


const head=()=>`<div class="top"><b>Salut, ${esc(cur)}</b><button onclick="logout()">Ieși</button></div>`;
function nav(h){
  const t=[['acasa','home','Acasă'],['lectii','book','Lecții'],['final','fin','Test final'],['clasament','lb','Clasament'],['profil','me','Profil']];
  const on=/^(lectie|test)-/.test(h)?'lectii':h;
  return `<div class="nav">${t.map(x=>`<a href="#${x[0]}" class="${on===x[0]?'on':''}">${svg(x[1])}${x[2]}</a>`).join('')}</div>`;
}
const page=(h,html)=>{$.innerHTML=head()+html+nav(h);scrollTo(0,0)};
function logout(){cur=null;save();clearInterval(tick);location.hash='#acasa';route()}
const hr=()=>location.hash.slice(1)||'acasa';


function auth(){
  $.innerHTML=`<div class="login"><div class="logo-mark">€</div><h1>Investește în viitor</h1>
  <p class="mute">Șase lecții de educație financiară, teste și un test final cu clasament. Contul e doar un nume și un PIN.</p>
  <div class="tabs"><button class="${authMode=='login'?'on':''}" id="t-in">Intră</button><button class="${authMode=='reg'?'on':''}" id="t-up">Cont nou</button></div><div id="form"></div>
  <p class="mute" style="margin-top:16px"><a href="#clasament" style="color:var(--or)">Vezi clasamentul public →</a></p></div>`;
  document.getElementById('t-in').onclick=()=>{authMode='login';err='';auth()};
  document.getElementById('t-up').onclick=()=>{authMode='reg';err='';auth()};
  const f=document.getElementById('form');
  if(authMode=='login'){
    const ns=Object.keys(users);
    f.innerHTML=`${ns.length?`<select id="u">${ns.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>`:`<input id="u" placeholder="Nume">`}
    <input id="p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><div class="err">${err}</div><button class="p" id="go">Intră în cont</button>`;
    document.getElementById('go').onclick=async()=>{
      const n=document.getElementById('u').value.trim().toLowerCase(),h=await sha(document.getElementById('p').value);
      if(!users[n]){err='Cont inexistent pe acest dispozitiv.';return auth()}
      if(users[n].pin!==h){err='PIN greșit.';return auth()}
      cur=n;err='';save();location.hash='#acasa';route()};
  }else{
    f.innerHTML=`<div class="note">Contul rămâne pe dispozitivul tău. În clasament apar doar numele (poreclă), nota și timpul. Testul final se deschide la ${UNLOCK_DAYS} de zile după crearea contului. Notează-ți PIN-ul.</div>
    <input id="u" placeholder="Poreclă (fără nume real)" maxlength="20"><input id="p" type="password" inputmode="numeric" placeholder="PIN (4 cifre)" autocomplete="new-password"><input id="p2" type="password" inputmode="numeric" placeholder="Confirmă PIN" autocomplete="new-password">
    <div class="err">${err}</div><button class="p" id="go">Creează cont</button>`;
    document.getElementById('go').onclick=async()=>{
      const n=document.getElementById('u').value.trim().toLowerCase().replace(/\s+/g,'_'),p=document.getElementById('p').value;
      if(n.length<3){err='Porecla: minim 3 caractere.';return auth()}
      if(!/^\d{4}$/.test(p)){err='PIN: exact 4 cifre.';return auth()}
      if(p!==document.getElementById('p2').value){err='PIN-urile nu coincid.';return auth()}
      if(users[n]){err='Porecla există deja pe acest dispozitiv.';return auth()}
      users[n]={pin:await sha(p),created:Date.now(),ls:{},fin:null,hide:false};cur=n;err='';save();location.hash='#acasa';route()};
  }
}


const done=u=>LESSONS.filter(l=>(u.ls[l.id]||0)>=4).length;
const unlockAt=u=>u.created+UNLOCK_DAYS*DAY;
function home(){
  const u=U(),d=done(u),left=unlockAt(u)-Date.now();
  page('acasa',`<div class="bal"><small>Progres lecții</small><div class="n">${d} / ${LESSONS.length}</div><small>Test de lecție trecut cu minimum 4/5</small></div><div class="pad">
  <div class="card"><h3>Lecțiile</h3><div class="bar"><i style="width:${d/LESSONS.length*100}%"></i></div>
  <p class="mute" style="margin:8px 0 0">Citește lecția, apoi dă testul. Poți relua testele oricând; se păstrează cel mai bun scor.</p><a class="btn p" href="#lectii">Continuă lecțiile</a></div>
  <div class="card"><h3>Testul final</h3><p class="mute">${u.fin&&u.fin.done?'Ai terminat testul final: nota '+fn(u.fin.nota)+'.':left>0?'Se deschide în '+Math.ceil(left/DAY)+' zile (după '+UNLOCK_DAYS+' de zile de la crearea contului).':'Este deschis! '+TOTAL+' întrebări, '+FIN_MIN+' minute, o singură încercare.'}</p><a class="btn" href="#final">Vezi detalii</a></div>
  <div class="card"><h3>Premii în contul de joc</h3><p class="mute">Nota 10 → 15 €. Nota 9–9,99 → 10 €. Sumele sunt virtuale.</p></div></div>`);
}
function lessons(){
  const u=U();
  page('lectii',`<div class="pad">${LESSONS.map((l,i)=>{const b=u.ls[l.id];return `<a class="card btn" style="margin-top:0;margin-bottom:12px" href="#lectie-${l.id}"><span class="mute">Lecția ${i+1}</span><h3 style="margin:2px 0 4px">${l.t}</h3><span class="mute">${l.s}</span>
  <div class="bar" style="margin-top:10px"><i style="width:${(b||0)/l.q.length*100}%"></i></div><span class="mute">${b!==undefined?'Cel mai bun scor: '+b+'/'+l.q.length:'Test nerezolvat'}</span></a>`}).join('')}</div>`);
}
function lesson(id){
  const i=LESSONS.findIndex(l=>l.id===id);if(i<0)return lessons();const l=LESSONS[i],n=LESSONS[i+1];
  page('lectii',`<div class="pad"><a href="#lectii" class="mute">← Toate lecțiile</a><div class="card art" style="margin-top:10px"><span class="mute">Lecția ${i+1} din ${LESSONS.length}</span><h2 style="margin:2px 0 8px;color:var(--or)">${l.t}</h2>${l.b}</div>
  <a class="btn p" href="#test-${l.id}">Începe testul lecției</a>${n?`<a class="btn ghost" href="#lectie-${n.id}">Următoarea: ${n.t} →</a>`:''}</div>`);
}
function quiz(id){
  const l=LESSONS.find(x=>x.id===id);if(!l)return lessons();
  if(!qz||qz.id!==id||qz.fresh!==false){qz={id,fresh:false,items:sh(l.q.map((_,k)=>({k,ord:sh([0,1,2,3])}))),ans:{},done:false}}
  drawQuiz();
}
function drawQuiz(){
  const u=U(),l=LESSONS.find(x=>x.id===qz.id),n=LESSONS[LESSONS.indexOf(l)+1];
  const c=qz.items.filter(it=>qz.ans[it.k]===0).length;
  page('lectii',`<div class="pad"><a href="#lectie-${l.id}" class="mute">← Înapoi la lecție</a><h2 style="color:var(--or)">Test: ${l.t}</h2>
  ${qz.done?`<div class="card"><div class="stat"><div class="n">${c}/${l.q.length}</div><div class="l">Cel mai bun scor: ${u.ls[l.id]}/${l.q.length}</div></div></div>`:''}
  ${qz.items.map((it,i)=>{const q=l.q[it.k];return `<div class="card"><h3>${i+1}. ${q[0]}</h3>${it.ord.map(j=>{const o=j===0?q[1]:q[1+j];
    let cls='opt';if(qz.ans[it.k]===j)cls+=' sel';if(qz.done){if(j===0)cls+=' right';else if(qz.ans[it.k]===j)cls+=' wrong'}
    return `<label class="${cls}"><input type="radio" name="q${it.k}" value="${j}" data-k="${it.k}" ${qz.ans[it.k]===j?'checked':''} ${qz.done?'disabled':''}>${o}</label>`}).join('')}
    ${qz.done?`<p class="mute" style="margin-bottom:0"><b>${qz.ans[it.k]===0?'Corect.':'Greșit.'}</b> ${q[5]}</p>`:''}</div>`}).join('')}
  <div class="err" id="qe"></div>
  ${qz.done?`<button class="p" id="again">Reia testul</button>${n?`<a class="btn ghost" href="#lectie-${n.id}">Lecția următoare</a>`:`<a class="btn ghost" href="#final">Testul final</a>`}`:`<button class="p" id="sub">Verifică răspunsurile</button>`}</div>`);
  $.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{qz.ans[r.dataset.k]=+r.value;$.querySelectorAll(`input[name=q${r.dataset.k}]`).forEach(x=>x.parentElement.classList.toggle('sel',x.checked))});
  const s=document.getElementById('sub');
  if(s)s.onclick=()=>{const miss=l.q.length-Object.keys(qz.ans).length;
    if(miss)return document.getElementById('qe').textContent='Mai ai '+miss+' întrebări fără răspuns.';
    qz.done=true;const sc=qz.items.filter(it=>qz.ans[it.k]===0).length;
    if(u.ls[l.id]===undefined||sc>u.ls[l.id]){u.ls[l.id]=sc;save()}drawQuiz()};
  const a=document.getElementById('again');if(a)a.onclick=()=>{qz=null;quiz(l.id)};
}


const RULES=`<ul class="mute" style="padding-left:18px"><li><b>${TOTAL} întrebări</b> din toate lecțiile.</li><li><b>${FIN_MIN} minute</b>. Cronometrul continuă și dacă închizi pagina.</li><li><b>O singură încercare.</b></li><li>Nota = corecte ÷ ${TOTAL} × 10.</li><li>Nota 10 → 15 €, nota 9–9,99 → 10 € (cont de joc).</li><li>Clasament: după notă, apoi după timp.</li></ul>`;
function final(){
  const u=U(),f=u.fin;
  if(f&&f.done)return result();
  if(f)return run();
  const left=unlockAt(u)-Date.now();
  if(left>0){const d=Math.floor(left/DAY),h=Math.floor(left%DAY/36e5),m=Math.floor(left%36e5/6e4);
    return page('final',`<div class="pad"><div class="card"><h3>Testul final</h3><p class="mute">Se deschide pe <b>${new Date(unlockAt(u)).toLocaleString('ro-RO',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</b>.</p>
    <div class="statg" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="n">${d}</div><div class="l">zile</div></div><div class="stat"><div class="n">${h}</div><div class="l">ore</div></div><div class="stat"><div class="n">${m}</div><div class="l">minute</div></div></div></div>
    <div class="card"><h3>Regulile testului</h3>${RULES}</div></div>`)}
  page('final',`<div class="pad"><div class="card"><h3>Testul final este deschis</h3><p class="mute">Ai nevoie de ${FIN_MIN} de minute libere și internet. Poți folosi hârtie și pix.</p><button class="p" id="st">Încep testul</button></div><div class="card"><h3>Regulile testului</h3>${RULES}</div></div>`);
  document.getElementById('st').onclick=()=>{if(!confirm('Începi testul final? Ai o singură încercare.'))return;
    const items=[];LESSONS.forEach((l,li)=>l.q.forEach((_,k)=>items.push({li,k,ord:sh([0,1,2,3])})));
    u.fin={start:Date.now(),items:sh(items),ans:{},cur:0,done:false};save();run()};
}
function run(){
  const u=U(),f=u.fin,end=f.start+FIN_MIN*6e4;
  if(Date.now()>=end)return finish(true);
  const it=f.items[f.cur],q=LESSONS[it.li].q[it.k],n=f.items.length,last=f.cur===n-1;
  page('final',`<div class="pad"><div class="timer"><div><b>Test final</b><div style="font-size:.8rem;opacity:.9" id="cnt">Răspunsuri: ${Object.keys(f.ans).length}/${n}</div></div><div class="t" id="tt">${mmss((end-Date.now())/1000)}</div></div>
  <div class="dots">${f.items.map((x,i)=>`<button data-i="${i}" class="${f.ans[i]!==undefined?'done':''} ${i===f.cur?'cur':''}">${i+1}</button>`).join('')}</div>
  <div class="card"><div class="mute">Întrebarea ${f.cur+1} din ${n} · ${LESSONS[it.li].t}</div><h3 style="font-size:1.1rem;margin-top:6px">${q[0]}</h3>
  ${it.ord.map(j=>`<label class="opt ${f.ans[f.cur]===j?'sel':''}"><input type="radio" name="fq" value="${j}" ${f.ans[f.cur]===j?'checked':''}>${j===0?q[1]:q[1+j]}</label>`).join('')}</div>
  <div class="row2"><button class="ghost" id="pv" ${f.cur===0?'disabled':''}>← Înapoi</button>${last?'':'<button class="ghost" id="nx">Următoarea →</button>'}</div><button class="p" id="snd">Trimite testul</button></div>`);
  $.querySelectorAll('input[name=fq]').forEach(r=>r.onchange=()=>{f.ans[f.cur]=+r.value;save();$.querySelectorAll('input[name=fq]').forEach(x=>x.parentElement.classList.toggle('sel',x.checked));
    $.querySelector(`.dots button[data-i="${f.cur}"]`).classList.add('done');document.getElementById('cnt').textContent='Răspunsuri: '+Object.keys(f.ans).length+'/'+n});
  $.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{f.cur=+b.dataset.i;save();run()});
  document.getElementById('pv').onclick=()=>{f.cur--;save();run()};
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{f.cur++;save();run()};
  document.getElementById('snd').onclick=()=>{const m=n-Object.keys(f.ans).length;if(confirm((m?'Mai ai '+m+' întrebări fără răspuns. ':'')+'Trimiți testul? Nu mai poți modifica nimic.'))finish(false)};
  clearInterval(tick);tick=setInterval(()=>{const s=(end-Date.now())/1000,t=document.getElementById('tt');if(!t)return clearInterval(tick);t.textContent=mmss(s);t.classList.toggle('low',s<300);if(s<=0){clearInterval(tick);finish(true)}},1000);
}
function finish(auto){
  clearInterval(tick);const u=U(),f=u.fin;
  const correct=f.items.filter((it,i)=>f.ans[i]===0).length,n=f.items.length;
  const nota=Math.round(correct/n*1000)/100;
  f.done=true;f.auto=!!auto;f.correct=correct;f.nota=nota;f.dur=Math.min(FIN_MIN*60,Math.round((Date.now()-f.start)/1000));f.bonus=nota>=10?15:nota>=9?10:0;save();
  publish();result();
}
function publish(){
  const u=U(),f=u.fin;if(!f||!f.done||u.hide)return Promise.resolve();
  const row={nick:cur,nota:f.nota,correct:f.correct,total:f.items.length,dur:f.dur,bonus:f.bonus,date:new Date().toISOString().slice(0,10)};
  return fetch(FB+'/final/'+encodeURIComponent(cur)+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)})
   .then(r=>{if(!r.ok)throw 0;board=null;toast('Scor publicat în clasament')}).catch(()=>toast('Nu s-a putut publica. Încearcă din Profil.'));
}
function result(){
  const u=U(),f=u.fin;
  const msg=f.bonus==15?'Perfect! 15 € în contul de joc.':f.bonus==10?'Excelent! 10 € în contul de joc.':'Ai terminat testul final. Mulțumim!';
  page('final',`<div class="bal"><small>Nota ta</small><div class="n">${fn(f.nota)}</div><small>${msg}</small></div><div class="pad"><div class="card">
  <div class="statg"><div class="stat"><div class="n">${f.correct}/${f.items.length}</div><div class="l">Corecte</div></div><div class="stat"><div class="n">${mmss(f.dur)}</div><div class="l">Timp</div></div></div>
  ${f.auto?'<p class="mute">Trimis automat la expirarea timpului.</p>':''}<a class="btn p" href="#clasament">Vezi clasamentul</a><button id="rev">Arată răspunsurile corecte</button><div id="review"></div></div></div>`);
  document.getElementById('rev').onclick=e=>{e.target.remove();document.getElementById('review').innerHTML=f.items.map((it,i)=>{const q=LESSONS[it.li].q[it.k],ok=f.ans[i]===0;
    return `<div class="note" style="background:${ok?'var(--green-bg)':'var(--red-bg)'};color:var(--ink)"><b>${i+1}. ${q[0]}</b><br>Răspuns corect: ${q[1]}<br>${ok?'Corect.':f.ans[i]===undefined?'Fără răspuns.':'Ai ales: '+q[1+f.ans[i]]}<br><span class="mute">${q[5]}</span></div>`}).join('')};
}

async function loadBoard(){
  if(board)return board;
  try{const r=await fetch(FB+'/final.json',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();
    board=d?(Array.isArray(d)?d:Object.values(d)).filter(x=>x&&x.nick&&isFinite(x.nota)):[];boardMsg='Clasament live';}
  catch(e){board=[];boardMsg='Clasamentul nu poate fi încărcat acum.'}
  return board;
}
const lbRow=(r,i)=>`<div class="lb-row ${r.nick===cur?'me':''}"><div class="lb-rank${i<3?' top':''}">${i+1}</div><div class="lb-info"><b>${esc(r.nick)}${r.nick===cur?' (tu)':''}</b><span class="mute">${r.correct}/${r.total||TOTAL} corecte · ${mmss(r.dur)}${r.bonus?' · '+r.bonus+' €':''}</span></div><div class="lb-score">${fn(r.nota)}</div></div>`;
async function leaderboard(){
  const draw=rows=>{const html=`<div class="pad"><div class="card"><h3>Clasament testul final</h3><p class="mute">${boardMsg||'Se încarcă…'} · întâi nota, apoi timpul mai scurt.</p>${rows?(rows.length?rows.map(lbRow).join(''):'<p class="mute">Încă nu a terminat nimeni testul final.</p>'):''}</div></div>`;
    if(cur)page('clasament',html);else{$.innerHTML=`<div class="top"><b>Clasament public</b><button onclick="location.hash='#acasa';route()">Intră</button></div>`+html}};
  draw(null);
  const b=await loadBoard();if(hr()!=='clasament')return;
  draw(b.slice().sort((a,c)=>c.nota-a.nota||a.dur-c.dur));
}
function profile(){
  const u=U(),best=Math.max(0,...Object.values(u.ls));
  page('profil',`<div class="pad"><div class="card"><h3>Profil</h3><p><b>${esc(cur)}</b></p>
  <div class="statg"><div class="stat"><div class="n">${done(u)}/${LESSONS.length}</div><div class="l">Lecții trecute</div></div><div class="stat"><div class="n">${u.fin&&u.fin.done?fn(u.fin.nota):'—'}</div><div class="l">Nota finală</div></div></div>
  <label class="chk"><input type="checkbox" id="hide" ${u.hide?'checked':''}> Nu mă arăta în clasament</label>
  ${u.fin&&u.fin.done?'<button id="pub">Publică din nou scorul în clasament</button>':''}</div>
  <div class="card"><h3>Despre</h3><p class="mute">Proiect educațional de educație financiară pentru tineri. Sumele din contul de joc sunt virtuale.</p></div></div>`);
  document.getElementById('hide').onchange=e=>{u.hide=e.target.checked;save()};
  const p=document.getElementById('pub');if(p)p.onclick=publish;
}

function route(){
  clearInterval(tick);
  const h=hr();
  if(h==='clasament'&&!cur)return leaderboard();
  if(!cur||!users[cur])return auth();
  if(h==='lectii')lessons();
  else if(h.startsWith('lectie-'))lesson(h.slice(7));
  else if(h.startsWith('test-'))quiz(h.slice(5));
  else if(h==='final')final();
  else if(h==='clasament')leaderboard();
  else if(h==='profil')profile();
  else home();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
