*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0000000d}
.card h3{margin:0 0 8px;font-size:1rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or);border-radius:99px;transition:width .4s}
.mute{color:var(--mute);font-size:.88rem}
button{font:inherit;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:13px 14px;margin-top:9px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--or);outline:2px solid var(--or);outline-offset:2px}
button.p{background:var(--or);border-color:var(--or);color:#fff;text-align:center;font-weight:700}
button.p:hover{background:var(--or2)}
button.w{border-style:dashed;border-color:var(--or);color:var(--or2);font-weight:600}

input,select,textarea{font:inherit;width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;margin-top:9px;background:#fff}

.note{background:var(--or-soft);border-radius:12px;padding:12px 14px;font-size:.82rem;color:var(--or2);margin:12px 0;line-height:1.45}
.tabs{display:flex;gap:8px;margin-bottom:12px}

.chip{display:inline-block;background:#fff3;border:1px solid #fff5;border-radius:99px;padding:4px 12px;font-size:.8rem;margin-top:12px}
.hidden{display:none!important}

.opt.right{border-color:var(--green);background:var(--green-bg)}

@media(min-width:900px){
  body{background:#e4e4e4}
  #app{max-width:1180px;background:var(--bg);box-shadow:0 0 40px #0002;padding-bottom:40px}

  .pub-hero{padding:56px calc((100% - 900px)/2 + 28px) 48px}
  .pub-hero h1{font-size:2.3rem}
  .toast{bottom:30px}

@media(max-width:899px){#app{min-height:100dvh}input,select,textarea{font-size:16px}}

async function sha256(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function newRound(u){
  let pool=P.map((_,i)=>i).filter(i=>!(u.seen||[]).includes(i));
  if(pool.length<ROUND){u.seen=[];pool=P.map((_,i)=>i)}
  u.q=sh(pool).slice(0,ROUND);u.seen=[...(u.seen||[]),...u.q];
  u.b=START;u.i=0;u.r=0;u.w=0;u.res=null;u.rounds=(u.rounds||0)+1;u.finishedRound=false;
}

function bestScore(u){
  if(!u.best||u.b>u.best.balance) u.best={balance:u.b,regrets:u.r,pauses:u.w,date:new Date().toISOString().slice(0,10)};
}

const roundDone=u=>!!(u.finishedRound||u.i>=ROUND);
function resultObj(u){
  const g=roundDone(u)||!u.best?{balance:u.b,regrets:u.r,pauses:u.w}:u.best;
  return {nick:cur,class:u.cls||'',balance:g.balance,regrets:g.regrets,pauses:g.pauses,hide:!!u.hide,rounds:u.rounds||1,lessonProgress:u.lessons||{},final:u.final&&u.final.done?{nota:u.final.nota,correct:u.final.correct,duration:u.final.duration,bonus:u.final.bonus}:null,date:new Date().toISOString().slice(0,10),demo:false};
}
function resultCode(u){return btoa(unescape(encodeURIComponent(JSON.stringify(resultObj(u)))))}
function decodeCode(c){try{return JSON.parse(decodeURIComponent(escape(atob(c.trim()))))}catch{return null}}

async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copiat!');}
  catch{prompt('Copiază:',t)}
}

function publishLocal(u){
  if(u.hide){toast('Ai ales să nu apari în clasament');return Promise.resolve()}
  if(!roundDone(u)&&!u.best&&!(u.final&&u.final.done)){toast('Termină o rundă ca să-ți publici scorul');return Promise.resolve()}
  const row=resultObj(u);
  let list=publicList().filter(x=>x.nick!==row.nick);
  list.push(row);
  savePublic(list);
  if(!FIREBASE_URL){toast('Publicat local (configurează FIREBASE_URL pentru sync global)');return Promise.resolve()}
  toast('Se publică…');
  const url=FIREBASE_URL.replace(/\/$/,'')+'/results/'+encodeURIComponent(row.nick)+'.json';
  return fetch(url,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null).then(prev=>{
    const out=(prev&&prev.nick===row.nick&&Number(prev.balance)>row.balance)?Object.assign({},prev,{final:row.final||prev.final||null,lessonProgress:row.lessonProgress,hide:row.hide,class:row.class}):row;
    return fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});
  }).then(r=>{
    if(!r.ok)throw new Error('HTTP '+r.status);
    lbOfficial=null;
    toast('Scor publicat — vizibil pentru toată lumea');
  }).catch(e=>{
    console.error(e);
    toast('Publicat doar local. Verifică FIREBASE_URL / regulile DB.');
  });
}

async function fetchRemoteResults(){
  if(!FIREBASE_URL)return null;
  const url=FIREBASE_URL.replace(/\/$/,'')+'/results.json';
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(!data)return [];
  // Firebase returns object map {nick: {...}} or array
  if(Array.isArray(data))return data.filter(Boolean);
  return Object.keys(data).map(k=>data[k]).filter(r=>r&&r.nick);
}

async function doLogin(){
  const n=(document.getElementById('u').value||'').trim().toLowerCase();
  const p=document.getElementById('p').value;
  if(!users[n]){err='Cont inexistent pe acest dispozitiv.';return login()}
  const h=await sha256(p);
  if(users[n].pin!==h && users[n].pin!==p){err='PIN greșit.';return login()}
  if(users[n].pin===p){users[n].pin=h;save()}
  if(!users[n].createdAt)users[n].createdAt=Date.now();if(!users[n].lessons)users[n].lessons={};cur=n;err='';save();home();
}
async function doRegister(){
  const n=(document.getElementById('u').value||'').trim().toLowerCase().replace(/\s+/g,'_');
  const p=document.getElementById('p').value, p2=document.getElementById('p2').value;
  const cls=document.getElementById('cls').value;
  if(n.length<3){err='Porecla: minim 3 caractere.';return login()}
  if(!/^\d{4,8}$/.test(p)){err='PIN: 4–8 cifre.';return login()}
  if(p!==p2){err='PIN-urile nu coincid.';return login()}
  if(users[n]){err='Porecla există deja pe acest dispozitiv.';return login()}
  const h=await sha256(p);
  users[n]={pin:h,cls,b:START,i:0,r:0,w:0,q:[],seen:[],h:[],rounds:0,res:null,hide:false,finishedRound:false,best:null,createdAt:Date.now(),lessons:{},final:null};
  newRound(users[n]);if(!users[n].createdAt)users[n].createdAt=Date.now();if(!users[n].lessons)users[n].lessons={};cur=n;err='';save();home();
}

function decide(){
  const u=U();
  if(u.res){
    const x=u.res;
    $.innerHTML=head()+`<div class="pad"><div class="card">
      <span class="tag ${x.r?'bad':''}">${x.r?'Regret':'Decizie bună'}</span>
      ${x.w?' <span class="tag info">pauză</span>':''}
      <p style="margin-top:12px">${esc(x.t)}</p>
      <p class="mute">${x.d<0?'Ai cheltuit '+(-x.d)+' lei.':x.d>0?'Ai primit '+x.d+' lei.':'Nu ai cheltuit nimic.'} Sold: <b>${u.b} lei</b></p>
      <button class="p" id="nx">${u.i>=ROUND-1?'Vezi rezultatul rundei':'Continuă — ziua '+(u.i+2)}</button>
    </div></div>`+nav();
    document.getElementById('nx').onclick=()=>{u.i++;u.res=null;if(u.i>=ROUND){u.finishedRound=true;bestScore(u)}save();home();scrollTo(0,0)};
    return;
  }
  const s=P[u.q[u.i]], opts=[...sh(s[1].filter(a=>!a.w)),...s[1].filter(a=>a.w)];
  $.innerHTML=head()+`<div class="pad"><div class="card">
    <div class="mute">Ziua ${u.i+1} din ${ROUND} · Runda ${u.rounds}</div>
    <h3 style="font-size:1.15rem;margin-top:6px">${esc(s[0])}</h3>
    ${opts.map((a,k)=>`<button class="${a.w?'w':''}" data-k="${k}">${esc(a.l)}</button>`).join('')}
  </div></div>`+nav();
  $.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{
    const a=opts[+b.dataset.k];
    u.b=Math.max(0,u.b+a.d);u.r+=a.r;u.w+=a.w?1:0;u.res=a;
    u.h.unshift({r:u.rounds,day:u.i+1,t:s[0],l:a.l,d:a.d,rg:a.r,w:!!a.w});
    save();decide();
  });
}

function mergeLB(official){
  const map={};
  (official||[]).forEach(r=>{if(r&&r.nick)map[r.nick]=r});
  publicList().forEach(r=>{
    if(!r||!r.nick||r.hide)return;
    const prev=map[r.nick];
    if(!prev||r.balance>prev.balance||(r.balance===prev.balance&&r.regrets<(prev.regrets||99))) map[r.nick]=r;
  });
  return Object.values(map);
}

  const render=()=>{
    const f=(document.getElementById('lb-f')||{}).value||'all';
    let rows=mergeLB(data).filter(r=>!r.hide);
    if(f!=='all')rows=rows.filter(r=>String(r.class)===f);
    rows.sort((a,b)=>b.balance!==a.balance?b.balance-a.balance:a.regrets-b.regrets);
    const list=document.getElementById('lb-list'); if(!list)return;
    list.innerHTML=rows.length?rows.map((r,i)=>lbRow(r,i)).join(''):'<p class="mute">Niciun rezultat încă.</p>';
    const finals=mergeLB(data).filter(r=>!r.hide&&r.final&&isFinite(Number(r.final.nota)))
      .sort((a,b)=>Number(b.final.nota)-Number(a.final.nota)||Number(a.final.duration||0)-Number(b.final.duration||0));

  const sel=document.getElementById('lb-f'); if(sel)sel.onchange=render;
  render();
}

{id:'buget',t:'Bugetul personal',ic:'book',s:'Cum îți planifici banii ca să ajungă — și să mai rămână.',

body:`<p>Un <b>buget</b> este un plan al banilor tăi pe o perioadă (de obicei o lună): câți bani intră (<b>venituri</b>) și pe ce ies (<b>cheltuieli</b>). Nu e o listă de interdicții, ci un instrument care îți arată unde merg banii, ca să decizi tu, nu întâmplarea.</p>

<h3>Venituri și cheltuieli</h3>

<ul><li><b>Venitul net</b> = banii pe care îi primești efectiv în mână (salariu după taxe, bursă, alocație, bani de buzunar).</li>

<li><b>Cheltuieli fixe</b> = aceeași sumă în fiecare lună: chirie, abonament de transport, rata la telefon, abonamente.</li>

<li><b>Cheltuieli variabile</b> = se schimbă de la o lună la alta: mâncare, haine, ieșiri, carburant.</li></ul>

<h3>Trei rezultate posibile</h3>

<ul><li><b>Excedent</b>: venituri &gt; cheltuieli. Diferența merge la economii sau obiective.</li>

<li><b>Echilibru</b>: venituri = cheltuieli. Nu rămâne nimic pentru neprevăzut.</li>

<li><b>Deficit</b>: cheltuieli &gt; venituri. Diferența vine din economii sau din datorii — semnal de alarmă.</li></ul>

<h3>Regula 50 / 30 / 20</h3>

<p>Un punct de plecare simplu pentru împărțirea venitului net:</p>

<div class="formula">50% nevoi · 30% dorințe · 20% economii și plata datoriilor</div>

<div class="box"><b>Exemplu:</b> la un venit net de 3.000 lei → 1.500 lei pentru nevoi, 900 lei pentru dorințe, 600 lei pentru economii.</div>

<h3>Cum îți faci bugetul în 5 pași</h3>

<div class="box">Procentul dintr-o sumă: <b>procent = parte ÷ total × 100</b>. Dacă pui deoparte 450 lei dintr-un venit de 3.000 lei, economisești 15%.</div>`,

{id:'nevoi',t:'Nevoi și dorințe',ic:'scale',s:'Diferența dintre ce îți trebuie și ce îți dorești.',

body:`<p>Fiecare leu poate fi cheltuit o singură dată. De aceea, înainte de orice cumpărătură, merită să întrebi: <b>am nevoie de asta sau doar îmi doresc?</b></p>

<h3>Ce sunt nevoile</h3>

<p><b>Nevoile</b> sunt lucrurile fără de care nu poți trăi sau funcționa normal: hrană de bază, locuință, utilități, îmbrăcăminte potrivită anotimpului, sănătate, transport la școală sau la serviciu, rechizitele necesare.</p>

<h3>Ce sunt dorințele</h3>

<p><b>Dorințele</b> îți fac viața mai plăcută, dar poți trăi fără ele: telefonul de ultimă generație când al tău funcționează, haine de firmă, abonamente de streaming, mâncatul în oraș, jocuri.</p>

<div class="box">Granița depinde de context. Un laptop e <b>dorință</b> dacă ai deja unul care merge, dar devine <b>nevoie</b> dacă ai un curs online obligatoriu și niciun alt dispozitiv. Chiar și în cazul unei nevoi, varianta scumpă poate fi o dorință: ai nevoie de ghete de iarnă, dar nu neapărat de cele de firmă.</div>

<h3>Costul de oportunitate</h3>

<p>Când alegi ceva, renunți la altceva. <b>Costul de oportunitate</b> este cea mai bună alternativă la care renunți. Dacă dai 300 lei pe căști, costul de oportunitate poate fi biletul la tabără pe care nu-l mai poți plăti.</p>

<h3>Capcanele cumpărăturilor</h3>

<ul><li><b>Urgența artificială</b>: „doar azi”, „ultimele bucăți” — marketingul te grăbește ca să nu mai cântărești.</li><li><b>Presiunea grupului</b>: „toți au” nu transformă o dorință în nevoie.</li><li><b>Costurile mici, repetate</b>: un abonament de 35 lei/lună înseamnă 420 lei pe an.</li></ul>

<ul><li>Fă o listă înainte de cumpărături și respect-o.</li><li><b>Regula de 48 de ore</b>: amână orice cumpărătură neplanificată două zile. Dacă încă o vrei, plănuiește-o în buget.</li><li>Acoperă întâi nevoile, apoi pune deoparte pentru dorințe.</li></ul>`,

{id:'economii',t:'Economiile',ic:'pig',s:'Cum pui bani deoparte și de ce contează fondul de urgență.',

body:`<p><b>Economiile</b> sunt partea din venit pe care nu o cheltui acum, ci o păstrezi pentru mai târziu: pentru un obiectiv sau pentru situații neprevăzute.</p>

<h3>Plătește-te pe tine primul</h3>

<p>Cea mai eficientă metodă: în ziua în care primești banii, muți imediat suma pentru economii într-un cont separat și abia apoi cheltui restul. Dacă aștepți „să rămână ceva” la final de lună, de obicei nu rămâne nimic.</p>

<div class="box"><b>Ordinea corectă:</b> primești venitul → transferi economia → îți împarți restul pe buget.</div>

<h3>Fondul de urgență</h3>

<p>Este o rezervă pentru cheltuieli neașteptate: un telefon stricat, o reparație, o problemă medicală, pierderea unui venit. Se recomandă să acopere <b>3–6 luni de cheltuieli esențiale</b>.</p>

<div class="formula">Fond de urgență = cheltuieli esențiale lunare × 3 (minim) … × 6</div>

<p>Banii din fondul de urgență trebuie să fie <b>lichizi</b> (ușor și rapid de accesat) și în siguranță: un cont de economii, nu acțiuni care pot scădea exact când ai nevoie de ei.</p>

<h3>Obiective SMART</h3>

<p>Un obiectiv bun este <b>S</b>pecific, <b>M</b>ăsurabil, <b>A</b>ccesibil, <b>R</b>elevant și încadrat în <b>T</b>imp. „Vreau să strâng bani” nu e SMART. „Strâng 1.200 lei pentru o bicicletă până la 1 iunie, punând deoparte 200 lei pe lună” este.</p>

<h3>Puterea sumelor mici</h3>

<p>10 lei pe zi înseamnă aproximativ 300 lei pe lună și 3.650 lei pe an. 50 lei pe săptămână înseamnă 2.600 lei pe an.</p>

<h3>De ce nu „sub saltea”?</h3>

<p>Banii ținuți în casă pot fi pierduți sau furați, iar <b>inflația</b> (creșterea generală a prețurilor) le scade puterea de cumpărare. Un cont de economii sau un depozit aduce dobândă, care compensează măcar o parte din inflație.</p>`,

{id:'dobanda',t:'Dobânda',ic:'pct',s:'Prețul banilor: simplă, compusă și efectul inflației.',

body:`<p><b>Dobânda</b> este prețul folosirii banilor altcuiva. Când economisești la bancă, banca îți plătește dobândă ție. Când te împrumuți, tu plătești dobândă băncii.</p>

<h3>Dobânda simplă</h3>

<p>Se calculează doar la suma inițială (capitalul), în fiecare an.</p>

<div class="formula">Dobândă = Capital × rată × ani</div>

<div class="box"><b>Exemplu:</b> 2.000 lei, 5% pe an, 3 ani → 2.000 × 0,05 × 3 = 300 lei dobândă. Total: 2.300 lei.</div>

<h3>Dobânda compusă</h3>

<p>Dobânda se adaugă la capital (<b>capitalizare</b>), iar anul următor câștigi dobândă și la dobânda deja primită — „dobânda la dobândă”.</p>

<div class="formula">Suma finală = Capital × (1 + rată)<sup>ani</sup></div>

<div class="box"><b>Exemplu:</b> 1.000 lei la 10% pe an: după 1 an 1.100 lei, după 2 ani 1.210 lei, după 3 ani 1.331 lei. Cu dobândă simplă ai fi avut doar 1.300 lei.</div>

<p>Cu cât capitalizarea e mai <b>frecventă</b> (lunară față de anuală, la aceeași rată), cu atât suma finală e puțin mai mare. Și cu cât începi mai <b>devreme</b>, cu atât efectul e mai puternic.</p>

<h3>Regula lui 72</h3>

<p>O estimare rapidă: în câți ani se dublează banii la dobândă compusă?</p>

<div class="formula">Ani până la dublare ≈ 72 ÷ rata anuală (%)</div>

<p>La 6% pe an: 72 ÷ 6 = 12 ani. La 8%: 9 ani.</p>

<h3>Dobânda reală și inflația</h3>

<p>Dacă prețurile cresc, banii tăi cumpără mai puțin. <b>Rata reală</b> arată cât câștigi cu adevărat:</p>

<div class="formula">Rata reală ≈ rata dobânzii − rata inflației</div>

<p>Depozit cu 6%, inflație 8% → rata reală ≈ −2%: deși suma crește, puterea ei de cumpărare scade.</p>`,

{q:'1.000 lei la 10% dobândă compusă anual, 2 ani. Ce sumă finală ai?',o:['1.210 lei','1.200 lei','1.100 lei','1.020 lei'],a:0,e:'1.000 × 1,1 × 1,1 = 1.210 lei.'},

{q:'Ce înseamnă capitalizarea dobânzii?',o:['Dobânda se adaugă la capital și produce la rândul ei dobândă','Banca îți ia un comision','Dobânda se plătește în numerar','Dobânda scade în timp'],a:0,e:'Prin capitalizare apare „dobânda la dobândă”.'},

{id:'credit',t:'Creditul',ic:'cardi',s:'Cum funcționează împrumuturile și cât costă de fapt.',

body:`<p>Un <b>credit</b> este un împrumut: primești bani acum și îi dai înapoi în timp, plus dobândă și eventual comisioane. Creditul nu e nici bun, nici rău în sine — contează pentru ce și în ce condiții îl folosești.</p>

<h3>Cuvinte-cheie</h3>

<ul><li><b>Principal</b> — suma împrumutată.</li><li><b>Rata lunară</b> — suma plătită în fiecare lună (o parte principal, o parte dobândă).</li><li><b>Dobânda</b> — prețul împrumutului.</li><li><b>Comisioanele</b> — costuri suplimentare (analiză dosar, administrare).</li><li><b>DAE</b> (Dobânda Anuală Efectivă) — costul total anual al creditului, care include dobânda <i>și</i> comisioanele. Este cel mai bun indicator pentru a compara oferte.</li></ul>

<h3>Cât costă de fapt?</h3>

<div class="formula">Cost total = (rata lunară × număr de rate) − suma împrumutată</div>

<div class="box"><b>Exemplu:</b> împrumuți 10.000 lei și plătești 12 rate de 950 lei → returnezi 11.400 lei. Creditul te-a costat 1.400 lei.</div>

<h3>Gradul de îndatorare</h3>

<p>Ratele tuturor creditelor nu ar trebui să-ți „mănânce” venitul. În România, BNR limitează, în general, totalul ratelor la <b>40% din venitul net</b>. La un venit de 4.000 lei, asta înseamnă cel mult 1.600 lei pe lună pentru rate.</p>

<h3>Cardul de credit</h3>

<p>Cardul de credit are de obicei o <b>perioadă de grație</b>: dacă returnezi integral suma cheltuită până la data scadentă, nu plătești dobândă. Dacă plătești doar „suma minimă”, restul datoriei produce dobândă mare și datoria poate crește de la lună la lună.</p>

<h3>Istoricul de credit</h3>

<p>Băncile verifică felul în care ți-ai plătit creditele (în România, prin <b>Biroul de Credit</b>). Întârzierile repetate îți strică istoricul: vei primi mai greu credite sau doar cu dobânzi mai mari.</p>

<h3>Credit „bun” și credit „rău”</h3>

<ul><li>Mai rezonabil: pentru lucruri care îți cresc venitul sau valoarea pe termen lung (studii, o locuință), cu o rată pe care ți-o permiți.</li><li>Riscant: pentru dorințe de moment (vacanță, gadgeturi), mai ales prin credite rapide cu DAE foarte mare.</li></ul>`,

q:[

{q:'Ce include DAE?',o:['Dobânda și comisioanele, exprimate anual','Doar dobânda','Doar comisioanele','Rata lunară'],a:0,e:'DAE arată costul total al creditului, de aceea e bun pentru comparație.'},

{q:'Împrumuți 5.000 lei și returnezi în total 5.900 lei. Cât te-a costat creditul?',o:['900 lei','5.900 lei','590 lei','18%'],a:0,e:'5.900 − 5.000 = 900 lei.'},

{q:'Ce se întâmplă dacă la cardul de credit plătești doar suma minimă?',o:['Restul datoriei produce dobândă și datoria poate crește','Nu plătești dobândă','Banca îți anulează datoria','Primești bonus de fidelitate'],a:0,e:'Perioada de grație funcționează doar dacă achiți integral.'},

{q:'Cum te afectează întârzierile repetate la plata ratelor?',o:['Îți strică istoricul de credit și creditele viitoare devin mai greu de obținut sau mai scumpe','Nu au niciun efect','Îți scad dobânda','Primești automat o amânare'],a:0,e:'Întârzierile apar în istoricul tău de credit.'},

{q:'Ai două oferte de credit. După ce indicator le compari cel mai corect?',o:['DAE','Doar dobânda nominală','Culoarea cardului','Numărul de agenții ale băncii'],a:0,e:'DAE include toate costurile, nu doar dobânda.'},

{q:'Care împrumut este, în general, mai rezonabil?',o:['Pentru studii care îți cresc șansele la un venit mai mare','Pentru o vacanță','Pentru cel mai nou telefon','Pentru a plăti alt credit rapid'],a:0,e:'Un credit care îți crește venitul viitor are mai mult sens decât unul pentru consum de moment.'}

]},

{id:'investitii',t:'Investițiile',ic:'chart',s:'Risc, randament, diversificare — și cum recunoști o capcană.',

body:`<p>A <b>investi</b> înseamnă a pune bani într-un activ cu speranța că acesta îți va aduce un câștig în timp. Spre deosebire de economisire, investiția implică <b>risc</b>: valoarea poate și să scadă.</p>

<h3>Risc și randament</h3>

<p>Regula de bază: <b>un randament potențial mai mare vine cu un risc mai mare</b>. Nimeni nu poate garanta câștiguri mari fără risc.</p>

<h3>Principalele instrumente</h3>

<ul><li><b>Depozitul bancar</b> — risc foarte mic, randament mic; bun pentru termen scurt.</li>

<li><b>Titlurile de stat</b> (în România, de exemplu Tezaur și Fidelis) — împrumuți statul și primești dobândă; risc scăzut.</li>

<li><b>Obligațiunile</b> — împrumuți o companie sau un stat; primești dobândă (cupon) și, la final, banii înapoi.</li>

<li><b>Acțiunile</b> — cumperi o parte dintr-o companie; câștigi dacă valoarea crește sau din dividende. Risc mai mare, potențial mai mare pe termen lung.</li>

<li><b>Fondurile de investiții și ETF-urile</b> — cumperi „un coș” cu multe acțiuni sau obligațiuni dintr-o dată.</li></ul>

<h3>Diversificarea</h3>

<p>„Nu pune toate ouăle în același coș.” Împărțind banii între mai multe companii, domenii și tipuri de active, reduci riscul ca o singură problemă să-ți afecteze toți banii. Diversificarea <b>reduce</b> riscul, dar nu îl elimină complet.</p>

<h3>Orizontul de timp</h3>

<p>Banii de care ai nevoie în curând (sub 1–2 ani) nu se pun în acțiuni, pentru că pot scădea exact atunci. Pe termen lung (10+ ani), scăderile temporare au timp să se recupereze.</p>

<div class="box"><b>Atenție la procente:</b> o scădere de 20% nu se anulează cu o creștere de 20%. 10.000 lei −20% = 8.000 lei; 8.000 lei +20% = 9.600 lei.</div>

<h3>Înainte să investești</h3>

<ol><li>Ai un buget și un fond de urgență.</li><li>Ai achitat datoriile scumpe (card de credit, credite rapide).</li><li>Investești doar bani de care nu ai nevoie pe termen scurt.</li></ol>

<h3>Semnale de înșelătorie</h3>

<p>Randamente „garantate” foarte mari (de exemplu 20–30% pe lună), presiune să decizi repede, recompense dacă aduci prieteni (schemă piramidală/Ponzi), firme neautorizate de ASF. Dacă sună prea bine ca să fie adevărat, probabil nu e.</p>`,

q:[

{q:'Ce înseamnă diversificarea?',o:['Împarți banii între mai multe investiții diferite pentru a reduce riscul','Pui toți banii în cea mai bună acțiune','Schimbi des banca','Investești doar în depozite'],a:0,e:'Diversificarea limitează impactul unei singure investiții care merge prost.'},

{q:'Ce cumperi când cumperi o acțiune?',o:['O parte din proprietatea unei companii','Un împrumut acordat companiei','Un depozit bancar','O poliță de asigurare'],a:0,e:'Acționarul deține o fracțiune din companie.'},

{q:'Ce este o obligațiune?',o:['Un împrumut acordat emitentului, pentru care primești dobândă','O parte dintr-o companie','O monedă digitală','Un cont curent'],a:0,e:'Prin obligațiune împrumuți bani unei companii sau unui stat.'},

{q:'O firmă îți promite 30% câștig garantat pe lună. Ce faci?',o:['Suspectezi o înșelătorie și verifici dacă e autorizată','Investești tot imediat','Te împrumuți ca să investești mai mult','Îi chemi și pe prieteni'],a:0,e:'Randamentele mari garantate sunt un semnal clasic de fraudă.'},

{q:'Ce relație există, de obicei, între risc și randament?',o:['Randament potențial mai mare vine cu risc mai mare','Randament mare înseamnă risc zero','Nu au nicio legătură','Riscul mare garantează câștigul'],a:0,e:'Asta e regula de bază a investițiilor.'},

{q:'Ce ar trebui să ai înainte să începi să investești?',o:['Un fond de urgență și datoriile scumpe achitate','Un credit de nevoi personale','Cel mai nou telefon','Un card de credit plin'],a:0,e:'Investițiile vin după siguranța financiară de bază.'}

]}

];

function lessonProgress(u){
  return LESSONS.filter(l=>Number((u.lessons||{})[l.id])>=5).length;
}
function lessons(){
  const u=U(); if(!u)return landing(); tab='edu';
  $.innerHTML=head()+`<div class="pad">
    <div class="card"><h2 style="margin:0 0 8px;color:var(--or)">Lecții de educație financiară</h2>
      <p class="mute">Citește lecțiile și rezolvă testele. Se păstrează cel mai bun punctaj pentru fiecare lecție.</p>
      <div class="statg"><div class="stat"><div class="n">${lessonProgress(u)}/6</div><div class="l">Lecții promovate</div></div><div class="stat"><div class="n">${Object.keys(u.lessons||{}).length}/6</div><div class="l">Teste încercate</div></div></div>
    </div>
    ${LESSONS.map((l,i)=>{const s=u.lessons&&u.lessons[l.id];return `<div class="card">
      <div class="mute">Lecția ${i+1} din 6</div><h3 style="color:var(--or);margin-top:5px">${esc(l.t)}</h3>
      <p class="mute">${esc(l.s)}</p>
      <div class="bar"><i style="width:${s===undefined?0:Math.round(Number(s)/l.q.length*100)}%"></i></div>
      <p class="mute">${s===undefined?'Test nerezolvat':'Cel mai bun scor: '+s+'/'+l.q.length}</p>
      <button class="p" data-lesson="${l.id}">Deschide lecția</button>
    </div>`}).join('')}
    <div class="card"><h3>Testul final</h3><p class="mute">30 de întrebări, 40 de minute și o singură încercare. Se deschide la 30 de zile după crearea contului.</p><button class="p" id="open-final">Vezi testul final</button></div>
  </div>`+nav();
  $.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>lessonPage(b.dataset.lesson));
  document.getElementById('open-final').onclick=finalPage;
}
function lessonPage(id){
  const u=U(), l=LESSONS.find(x=>x.id===id); if(!u||!l)return lessons(); tab='edu';
  $.innerHTML=head()+`<div class="pad"><div class="card">
    <button class="ghost" id="back-lessons">← Toate lecțiile</button>
    <div class="mute" style="margin-top:14px">Lecția ${LESSONS.indexOf(l)+1} din 6</div>
    <h2 style="color:var(--or)">${esc(l.t)}</h2><p class="mute">${esc(l.s)}</p>
    <div class="lesson-body">${l.body}</div>
    <div class="note">După ce ai parcurs lecția, verifică ce ai reținut prin testul de mai jos.</div>
    <button class="p" id="take-quiz">Începe testul (${l.q.length} întrebări)</button>
  </div></div>`+nav();
  document.getElementById('back-lessons').onclick=lessons;
  document.getElementById('take-quiz').onclick=()=>lessonTest(id);
}
function lessonTest(id){
  const u=U(), l=LESSONS.find(x=>x.id===id); if(!u||!l)return lessons();
  lessonQuiz={id,answers:{},done:false,order:sh(l.q.map((_,i)=>i)),opts:l.q.map(q=>sh(q.o.map((_,k)=>k)))}; drawLessonTest();
}
function drawLessonTest(){
  const u=U(),l=LESSONS.find(x=>x.id===lessonQuiz.id),qidx=lessonQuiz.order;
  const score=lessonQuiz.done?l.q.filter((q,i)=>lessonQuiz.answers[i]===q.a).length:null;
  $.innerHTML=head()+`<div class="pad"><div class="card">
    <button class="ghost" id="back-lesson">← Înapoi la lecție</button>
    <h2 style="color:var(--or);margin-top:12px">Test: ${esc(l.t)}</h2>
    ${lessonQuiz.done?`<div class="statg"><div class="stat"><div class="n">${score}/${l.q.length}</div><div class="l">Punctaj obținut</div></div><div class="stat"><div class="n">${Math.max(score,Number((u.lessons||{})[l.id])||0)}/${l.q.length}</div><div class="l">Cel mai bun scor</div></div></div>`:''}
    ${qidx.map((qi,n)=>{const q=l.q[qi],chosen=lessonQuiz.answers[qi];return `<div class="card" style="background:#fafafa;border:1px solid var(--line)">
      <b>${n+1}. ${esc(q.q)}</b>
      ${(lessonQuiz.opts[qi]||q.o.map((_,k)=>k)).map(j=>{const o=q.o[j];return `<label class="opt ${chosen===j?'sel':''} ${lessonQuiz.done?(j===q.a?'right':chosen===j?'wrong':''):''}">
        <input type="radio" name="lq${qi}" value="${j}" ${chosen===j?'checked':''} ${lessonQuiz.done?'disabled':''}>${esc(o)}
      </label>`}).join('')}
      ${lessonQuiz.done?`<p class="mute">${chosen===q.a?'Corect.':'Greșit.'} ${esc(q.e)}</p>`:''}
    </div>`}).join('')}
    ${lessonQuiz.done?'<button class="p" id="retry">Reia testul</button><button id="back-all">Înapoi la lecții</button>':'<button class="p" id="submit-lq">Verifică răspunsurile</button>'}
  </div></div>`+nav();
  document.getElementById('back-lesson').onclick=()=>lessonPage(l.id);
  if(!lessonQuiz.done){
    $.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{lessonQuiz.answers[Number(r.name.slice(2))]=Number(r.value);drawLessonTestKeepScroll()});
    document.getElementById('submit-lq').onclick=()=>{
      if(Object.keys(lessonQuiz.answers).length!==l.q.length){toast('Răspunde la toate întrebările.');return}
      lessonQuiz.done=true;const c=l.q.filter((q,i)=>lessonQuiz.answers[i]===q.a).length;
      if(!u.lessons)u.lessons={};if(u.lessons[l.id]===undefined||c>Number(u.lessons[l.id]))u.lessons[l.id]=c;
      save();drawLessonTest();
    };
  }else{
    document.getElementById('retry').onclick=()=>lessonTest(l.id);
    document.getElementById('back-all').onclick=lessons;
  }
}
function drawLessonTestKeepScroll(){
  const y=window.scrollY;drawLessonTest();window.scrollTo(0,y);
}

const FINAL_MINUTES=40;
function finalPage(){
  const u=U();if(!u)return landing();tab='edu';
  if(!u.createdAt){u.createdAt=Date.now();save();}
  if(u.final&&u.final.done){showFinalResult();return}
  if(u.final&&u.final.started){drawFinal();return}
  const unlock=Number(u.createdAt)+30*86400000,left=unlock-Date.now();
  if(left>0){
    const days=Math.ceil(left/86400000);
    $.innerHTML=head()+`<div class="pad"><div class="card"><h2 style="color:var(--or)">Testul final</h2>
      <p class="mute">Testul se deschide la 30 de zile după crearea contului.</p>
      <div class="stat"><div class="n">${days}</div><div class="l">zile rămase</div></div>
      <p class="mute">Până atunci, parcurge lecțiile și încearcă să obții cel puțin 5/6 la fiecare test.</p>
      <button class="p" id="back-lessons2">Continuă lecțiile</button></div></div>`+nav();
    document.getElementById('back-lessons2').onclick=lessons;return;
  }
  $.innerHTML=head()+`<div class="pad"><div class="card"><h2 style="color:var(--or)">Testul final este disponibil!</h2>
    <p class="mute">30 de întrebări din toate cele șase lecții · ${FINAL_MINUTES} de minute · o singură încercare.</p>
    <div class="note">După începerea testului, cronometrul continuă chiar dacă închizi pagina. Rezultatul se salvează în profilul tău.</div>
    <button class="p" id="start-final">Începe testul</button></div></div>`+nav();
  document.getElementById('start-final').onclick=startFinal;
}
function startFinal(){
  const u=U();if(!u)return;
  const all=[];LESSONS.forEach(l=>l.q.forEach((q,i)=>all.push({id:l.id+'_'+i,lesson:l.t,q:q.q,o:q.o,a:q.a,e:q.e,ord:sh(q.o.map((_,k)=>k))})));
  const selected=sh(all).slice(0,30);
  u.final={started:true,startedAt:Date.now(),endsAt:Date.now()+FINAL_MINUTES*60000,questions:selected,answers:{},done:false};
  save();drawFinal();
}
function drawFinal(){
  const u=U(),f=u&&u.final;if(!f||!f.started)return finalPage();
  if(Date.now()>=f.endsAt)return finishFinal(true);
  const remaining=Math.max(0,Math.ceil((f.endsAt-Date.now())/1000));
  const answered=Object.keys(f.answers||{}).length;
  $.innerHTML=head()+`<div class="pad"><div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>Test final</b><b id="final-clock" style="color:var(--or)">${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}</b></div>
    <p class="mute">Răspunsuri: ${answered}/30</p><div class="bar"><i style="width:${answered/30*100}%"></i></div>
    ${f.questions.map((q,i)=>`<div class="card" style="background:#fafafa;border:1px solid var(--line)">
      <div class="mute">Întrebarea ${i+1} · ${esc(q.lesson)}</div><b>${esc(q.q)}</b>
      ${(q.ord||q.o.map((_,k)=>k)).map(j=>{const o=q.o[j];return `<label class="opt ${f.answers[q.id]===j?'sel':''}"><input type="radio" name="fq${i}" value="${j}" ${f.answers[q.id]===j?'checked':''}>${esc(o)}</label>`}).join('')}
    </div>`).join('')}
    <button class="p" id="submit-final">Trimite testul</button>
  </div></div>`+nav();
  f.questions.forEach((q,i)=>$.querySelectorAll(`input[name="fq${i}"]`).forEach(r=>r.onchange=()=>{f.answers[q.id]=Number(r.value);save();}));
  document.getElementById('submit-final').onclick=()=>{if(Object.keys(f.answers).length<30&&!confirm('Mai ai întrebări fără răspuns. Trimiți oricum?'))return;finishFinal(false)};
  clearInterval(finalTick);
  finalTick=setInterval(()=>{
    const s=Math.max(0,Math.ceil((f.endsAt-Date.now())/1000)),el=document.getElementById('final-clock');
    if(el)el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    if(s<=0)finishFinal(true);
  },1000);
}
function finishFinal(auto){
  const u=U(),f=u&&u.final;if(!f||f.done)return showFinalResult();
  clearInterval(finalTick);
  const correct=f.questions.filter(q=>f.answers[q.id]===q.a).length;
  const nota=Math.round(correct/30*1000)/100;
  f.done=true;f.correct=correct;f.nota=nota;f.duration=Math.min(FINAL_MINUTES*60,Math.round((Date.now()-f.startedAt)/1000));f.auto=!!auto;f.bonus=nota===10?15:nota>=9?10:0;
  save();publishLocal(u);showFinalResult();
}
function showFinalResult(){
  const u=U(),f=u&&u.final;if(!f)return finalPage();
  $.innerHTML=head()+`<div class="pad"><div class="card">
    <h2 style="color:var(--or)">Rezultatul testului final</h2>
    <div class="statg"><div class="stat"><div class="n">${Number(f.nota).toFixed(2).replace('.',',')}</div><div class="l">Nota finală</div></div><div class="stat"><div class="n">${f.correct}/30</div><div class="l">Răspunsuri corecte</div></div></div>
    <p>${f.bonus?`Ai primit ${f.bonus} € în contul virtual al concursului.`:'Mulțumim pentru participare!'}</p>
    <p class="mute">Timp: ${Math.floor((f.duration||0)/60)} min · ${f.auto?'Test trimis automat la expirarea timpului.':'Test trimis de participant.'}</p>
    <button class="p" id="to-board">Vezi clasamentul</button><button id="to-lessons">Înapoi la lecții</button>
  </div></div>`+nav();
  document.getElementById('to-board').onclick=leaderboard;
  document.getElementById('to-lessons').onclick=lessons;
}

function admin(){
  $.innerHTML=`<div class="admin"><h2 style="color:var(--or2)">Admin rezultate</h2>
  <div class="card" id="adm-login"><h3>Autentificare</h3>
    <input id="ap" type="password" placeholder="Parolă admin">
    <button class="p" id="al">Intră</button></div>
  <div id="adm-panel" class="hidden">
    <div class="card"><h3>Importă coduri</h3>
      <p class="mute">Lipește coduri de rezultat, câte unul pe linie.</p>
      <textarea id="acodes" placeholder="eyJuaWNrIjoi..."></textarea>
      <button class="p" id="aimp">Validează și adaugă</button>
      <div id="alog" class="mute" style="margin-top:8px"></div>
    </div>
    <div class="card"><h3>Rezultate (<span id="acnt">0</span>)</h3>
      <div id="alist" class="mute" style="max-height:200px;overflow:auto"></div>
      <button class="p" id="adl">Descarcă results.json</button>
      <button id="acsv">Export CSV</button>
    </div>
    <div class="card"><h3>Statistici</h3><div id="astats" class="statg"></div></div>
    <button id="aex">Închide</button>
  </div></div>`;
  document.getElementById('al').onclick=async()=>{
    if(await sha256(document.getElementById('ap').value)!==ADMIN_HASH)return toast('Parolă greșită');
    document.getElementById('adm-login').classList.add('hidden');
    document.getElementById('adm-panel').classList.remove('hidden');
    loadLB().then(d=>{adminRows=mergeLB(d).slice();refreshAdmin()});
  };
  document.getElementById('aimp').onclick=()=>{
    const lines=document.getElementById('acodes').value.trim().split(/\n+/).filter(Boolean);
    let ok=0,fail=0,log=[];
    lines.forEach(line=>{
      const o=decodeCode(line);
      if(!o||!o.nick){fail++;log.push('Invalid');return}
      adminRows=adminRows.filter(r=>r.nick!==o.nick);
      const row={nick:o.nick,class:o.class,balance:o.balance,regrets:o.regrets,pauses:o.pauses,final:o.final||null,hide:!!o.hide,date:o.date,demo:false};
      adminRows.push(row);
      if(FIREBASE_URL){
        fetch(FIREBASE_URL.replace(/\/$/,'')+'/results/'+encodeURIComponent(row.nick)+'.json',{
          method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)
        }).catch(()=>{});
      }
      ok++;log.push('OK '+o.nick);
    });
    document.getElementById('alog').textContent=log.join(' · ');
    toast(ok+' adăugate, '+fail+' eșuate');refreshAdmin();
  };
  document.getElementById('adl').onclick=()=>{
    const blob=new Blob([JSON.stringify(adminRows,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='results.json';a.click();
  };
  document.getElementById('acsv').onclick=()=>{
    const h='nick,class,balance,regrets,pauses,final_nota,hide,date\n';
    const rows=adminRows.map(r=>[r.nick,r.class,r.balance,r.regrets,r.pauses||0,r.final&&r.final.nota||'',r.hide,r.date||''].join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+rows],{type:'text/csv'}));a.download='results.csv';a.click();
  };
  document.getElementById('aex').onclick=()=>{location.hash='';landing()};
}
function refreshAdmin(){
  document.getElementById('acnt').textContent=adminRows.length;
  document.getElementById('alist').innerHTML=adminRows.map(r=>esc(r.nick)+' · cl.'+r.class+' · '+r.balance+' lei · '+r.regrets+' regrete').join('<br>')||'—';
  const n=adminRows.length||1;
  const avg=(adminRows.reduce((s,r)=>s+(r.regrets||0),0)/n).toFixed(1);
  const fin=adminRows.length;
  document.getElementById('astats').innerHTML=`<div class="stat"><div class="n">${fin}</div><div class="l">Participanți</div></div>
    <div class="stat"><div class="n">${avg}</div><div class="l">Regrete medii</div></div>`;
}

function boot(){
  if(location.hash==='#admin')return admin();
  if(cur&&users[cur]){const u=users[cur];if(!u.createdAt)u.createdAt=Date.now();if(!u.lessons)u.lessons={};save();home()}
  else landing();
}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')admin();else if(!cur)landing()});
boot();
</script>
