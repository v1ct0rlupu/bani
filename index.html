async function sha256(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function newRound(u){
  let pool=P.map((_,i)=>i).filter(i=>!(u.seen||[]).includes(i));
  if(pool.length<ROUND){u.seen=[];pool=P.map((_,i)=>i)}
  u.q=sh(pool).slice(0,ROUND);u.seen=[...(u.seen||[]),...u.q];
  u.b=START;u.i=0;u.r=0;u.w=0;u.res=null;u.rounds=(u.rounds||0)+1;u.finishedRound=false;
}

function bestScore(u){
  if(!u.best||u.b>u.best.balance) u.best={balance:u.b,regrets:u.r,pauses:u.w,date:new Date().toISOString().slice(0,10)};
}

function resultObj(u){

}
function resultCode(u){return btoa(unescape(encodeURIComponent(JSON.stringify(resultObj(u)))))}
function decodeCode(c){try{return JSON.parse(decodeURIComponent(escape(atob(c.trim()))))}catch{return null}}

async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copiat!');}
  catch{prompt('Copiază:',t)}
}

function publishLocal(u){
  if(u.hide){toast('Ai ales să nu apari în clasament');return}
  const row=resultObj(u);
  // local always
  let list=publicList().filter(x=>x.nick!==row.nick);
  list.push(row);
  savePublic(list);
  // remote
  if(!FIREBASE_URL){toast('Publicat local (configurează FIREBASE_URL pentru sync global)');return}
  toast('Se publică…');
  fetch(FIREBASE_URL.replace(/\/$/,'')+'/results/'+encodeURIComponent(row.nick)+'.json',{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(row)
  }).then(r=>{
    if(!r.ok)throw new Error('HTTP '+r.status);
    lbOfficial=null; // force refresh
    toast('Scor publicat — vizibil pentru toată lumea');
  }).catch(e=>{
    console.error(e);
    toast('Publicat doar local. Verifică FIREBASE_URL / regulile DB.');
  });
}

async function fetchRemoteResults(){
  if(!FIREBASE_URL)return null;
  const url=FIREBASE_URL.replace(/\/$/,'')+'/results.json';
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(!data)return [];
  // Firebase returns object map {nick: {...}} or array
  if(Array.isArray(data))return data.filter(Boolean);
  return Object.keys(data).map(k=>data[k]).filter(r=>r&&r.nick);
}

async function doLogin(){
  const n=(document.getElementById('u').value||'').trim().toLowerCase();
  const p=document.getElementById('p').value;
  if(!users[n]){err='Cont inexistent pe acest dispozitiv.';return login()}
  const h=await sha256(p);
  if(users[n].pin!==h && users[n].pin!==p){err='PIN greșit.';return login()}
  if(users[n].pin===p){users[n].pin=h;save()}
  cur=n;err='';save();home();
}
async function doRegister(){
  const n=(document.getElementById('u').value||'').trim().toLowerCase().replace(/\s+/g,'_');
  const p=document.getElementById('p').value, p2=document.getElementById('p2').value;
  const cls=document.getElementById('cls').value;
  if(n.length<3){err='Porecla: minim 3 caractere.';return login()}
  if(!/^\d{4,8}$/.test(p)){err='PIN: 4–8 cifre.';return login()}
  if(p!==p2){err='PIN-urile nu coincid.';return login()}
  if(users[n]){err='Porecla există deja pe acest dispozitiv.';return login()}
  const h=await sha256(p);
  users[n]={pin:h,cls,b:START,i:0,r:0,w:0,q:[],seen:[],h:[],rounds:0,res:null,hide:false,finishedRound:false,best:null};
  newRound(users[n]);cur=n;err='';save();home();
}

function home(){
  const u=U(); if(!u)return landing();
  if(u.finishedRound||u.i>=ROUND)return endR();
  tab='home';
  const day=u.i+1, pct=Math.round(u.i/ROUND*100);
  $.innerHTML=head()+`<div class="bal"><small>Sold virtual</small><div class="n">${u.b} lei</div>
    <small>Obiectiv: minim ${GOAL} lei · Runda ${u.rounds}</small></div>

    <div class="bar"><i style="width:${pct}%"></i></div>

  <div class="card"><h3>Plată în așteptare</h3>

  <div class="card"><h3>Sfat rapid</h3><p class="mute">Regretul vine din deciziile pe loc. Dacă nu e urgent, așteaptă — de multe ori pofta trece.</p></div>
  </div>`+nav();
  document.getElementById('go').onclick=decide;
}

function decide(){
  const u=U();
  if(u.res){
    const x=u.res;
    $.innerHTML=head()+`<div class="pad"><div class="card">
      <span class="tag ${x.r?'bad':''}">${x.r?'Regret':'Decizie bună'}</span>
      ${x.w?' <span class="tag info">pauză</span>':''}
      <p style="margin-top:12px">${esc(x.t)}</p>
      <p class="mute">${x.d<0?'Ai cheltuit '+(-x.d)+' lei.':x.d>0?'Ai primit '+x.d+' lei.':'Nu ai cheltuit nimic.'} Sold: <b>${u.b} lei</b></p>
      <button class="p" id="nx">${u.i>=ROUND-1?'Vezi rezultatul rundei':'Continuă — ziua '+(u.i+2)}</button>
    </div></div>`+nav();
    document.getElementById('nx').onclick=()=>{u.i++;u.res=null;if(u.i>=ROUND){u.finishedRound=true;bestScore(u)}save();home();scrollTo(0,0)};
    return;
  }
  const s=P[u.q[u.i]], opts=[...sh(s[1].filter(a=>!a.w)),...s[1].filter(a=>a.w)];
  $.innerHTML=head()+`<div class="pad"><div class="card">
    <div class="mute">Ziua ${u.i+1} din ${ROUND} · Runda ${u.rounds}</div>
    <h3 style="font-size:1.15rem;margin-top:6px">${esc(s[0])}</h3>
    ${opts.map((a,k)=>`<button class="${a.w?'w':''}" data-k="${k}">${esc(a.l)}</button>`).join('')}
  </div></div>`+nav();
  $.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{
    const a=opts[+b.dataset.k];
    u.b=Math.max(0,u.b+a.d);u.r+=a.r;u.w+=a.w?1:0;u.res=a;
    u.h.unshift({r:u.rounds,day:u.i+1,t:s[0],l:a.l,d:a.d,rg:a.r,w:!!a.w});
    save();decide();
  });
}

/* ===== LEADERBOARD ===== */
function lbRow(r,i){
  return `<div class="lb-row"><div class="lb-rank${i<3?' top':''}">${i+1}</div>
    <div class="lb-info"><b>${esc(r.nick)}</b><span class="mute">cl. ${esc(String(r.class))} · ${r.regrets} regrete · ${r.pauses||0} pauze${r.demo?' · demo':''}</span></div>
    <div class="lb-score">${r.balance} lei</div></div>`;
}

function mergeLB(official){
  const map={};
  (official||[]).forEach(r=>{if(r&&r.nick)map[r.nick]=r});
  publicList().forEach(r=>{
    if(!r||!r.nick||r.hide)return;
    const prev=map[r.nick];
    if(!prev||r.balance>prev.balance||(r.balance===prev.balance&&r.regrets<(prev.regrets||99))) map[r.nick]=r;
  });
  return Object.values(map);
}

async function loadLB(){
  if(lbOfficial)return lbOfficial;
  // 1) Firebase (dinamic)
  if(FIREBASE_URL){
    try{
      const remote=await fetchRemoteResults();
      lbOfficial=remote||[];
      lbStatus='Clasament live (Firebase)';
      return lbOfficial;
    }catch(e){
      console.error(e);
      lbStatus='Firebase indisponibil — fallback local';
    }
  }
  // 2) results.json pe GitHub Pages (static)
  try{
    const res=await fetch('data/results.json',{cache:'no-store'});
    if(!res.ok)throw new Error('x');
    lbOfficial=await res.json();
    lbStatus=FIREBASE_URL?'Fallback results.json':'Clasament din results.json + publicări locale';
    return lbOfficial;
  }catch(e){}
  // 3) doar local + demo
  lbOfficial=[];
  if(!publicList().length){
    lbOfficial=[
      {nick:'demo_alex',class:'10',balance:420,regrets:2,pauses:4,hide:false,demo:true},
      {nick:'demo_mira',class:'11',balance:380,regrets:3,pauses:3,hide:false,demo:true},
      {nick:'demo_radu',class:'9',balance:310,regrets:5,pauses:2,hide:false,demo:true},
      {nick:'demo_ioana',class:'12',balance:450,regrets:1,pauses:5,hide:false,demo:true},
      {nick:'demo_andrei',class:'10',balance:290,regrets:6,pauses:1,hide:false,demo:true},
      {nick:'demo_elena',class:'11',balance:360,regrets:3,pauses:4,hide:false,demo:true},
      {nick:'demo_vlad',class:'9',balance:400,regrets:2,pauses:5,hide:false,demo:true},
      {nick:'demo_sofia',class:'12',balance:340,regrets:4,pauses:2,hide:false,demo:true}
    ];
    lbStatus='Date demo — configurează FIREBASE_URL pentru clasament live';
  }else{
    lbStatus='Doar rezultate publicate pe acest dispozitiv';
  }
  return lbOfficial;
}

async function fillLeaderboard(){
  const data=await loadLB();
  const st=document.getElementById('lb-st'); if(st)st.textContent=lbStatus;
  const render=()=>{
    const f=(document.getElementById('lb-f')||{}).value||'all';
    let rows=mergeLB(data).filter(r=>!r.hide);
    if(f!=='all')rows=rows.filter(r=>String(r.class)===f);
    rows.sort((a,b)=>b.balance!==a.balance?b.balance-a.balance:a.regrets-b.regrets);
    const list=document.getElementById('lb-list'); if(!list)return;
    list.innerHTML=rows.length?rows.map((r,i)=>lbRow(r,i)).join(''):'<p class="mute">Niciun rezultat încă.</p>';
  };
  const sel=document.getElementById('lb-f'); if(sel)sel.onchange=render;
  render();
}

function admin(){
  $.innerHTML=`<div class="admin"><h2 style="color:var(--or2)">Admin rezultate</h2>
  <div class="card" id="adm-login"><h3>Autentificare</h3>
    <input id="ap" type="password" placeholder="Parolă admin">

  <div id="adm-panel" class="hidden">
    <div class="card"><h3>Importă coduri</h3>
      <p class="mute">Lipește coduri de rezultat, câte unul pe linie.</p>
      <textarea id="acodes" placeholder="eyJuaWNrIjoi..."></textarea>
      <button class="p" id="aimp">Validează și adaugă</button>
      <div id="alog" class="mute" style="margin-top:8px"></div>
    </div>
    <div class="card"><h3>Rezultate (<span id="acnt">0</span>)</h3>
      <div id="alist" class="mute" style="max-height:200px;overflow:auto"></div>
      <button class="p" id="adl">Descarcă results.json</button>
      <button id="acsv">Export CSV</button>
    </div>
    <div class="card"><h3>Statistici</h3><div id="astats" class="statg"></div></div>
    <button id="aex">Închide</button>
  </div></div>`;
  document.getElementById('al').onclick=()=>{
    if(document.getElementById('ap').value!==ADMIN_PASS)return toast('Parolă greșită');
    document.getElementById('adm-login').classList.add('hidden');
    document.getElementById('adm-panel').classList.remove('hidden');
    loadLB().then(d=>{adminRows=mergeLB(d).slice();refreshAdmin()});
  };
  document.getElementById('aimp').onclick=()=>{
    const lines=document.getElementById('acodes').value.trim().split(/\n+/).filter(Boolean);
    let ok=0,fail=0,log=[];
    lines.forEach(line=>{
      const o=decodeCode(line);
      if(!o||!o.nick){fail++;log.push('Invalid');return}
      adminRows=adminRows.filter(r=>r.nick!==o.nick);
      const row={nick:o.nick,class:o.class,balance:o.balance,regrets:o.regrets,pauses:o.pauses,hide:!!o.hide,date:o.date,demo:false};
      adminRows.push(row);
      if(FIREBASE_URL){
        fetch(FIREBASE_URL.replace(/\/$/,'')+'/results/'+encodeURIComponent(row.nick)+'.json',{
          method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)
        }).catch(()=>{});
      }
      ok++;log.push('OK '+o.nick);
    });
    document.getElementById('alog').textContent=log.join(' · ');
    toast(ok+' adăugate, '+fail+' eșuate');refreshAdmin();
  };
  document.getElementById('adl').onclick=()=>{
    const blob=new Blob([JSON.stringify(adminRows,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='results.json';a.click();
  };
  document.getElementById('acsv').onclick=()=>{
    const h='nick,class,balance,regrets,pauses,hide,date\n';
    const rows=adminRows.map(r=>[r.nick,r.class,r.balance,r.regrets,r.pauses||0,r.hide,r.date||''].join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+rows],{type:'text/csv'}));a.download='results.csv';a.click();
  };
  document.getElementById('aex').onclick=()=>{location.hash='';landing()};
}

  document.getElementById('acnt').textContent=adminRows.length;
  document.getElementById('alist').innerHTML=adminRows.map(r=>esc(r.nick)+' · cl.'+r.class+' · '+r.balance+' lei · '+r.regrets+' regrete').join('<br>')||'—';
  const n=adminRows.length||1;
  const avg=(adminRows.reduce((s,r)=>s+(r.regrets||0),0)/n).toFixed(1);
  const fin=adminRows.length;
  document.getElementById('astats').innerHTML=`<div class="stat"><div class="n">${fin}</div><div class="l">Participanți</div></div>
    <div class="stat"><div class="n">${avg}</div><div class="l">Regrete medii</div></div>`;
}

/* ===== ROUTER ===== */
function boot(){
  if(location.hash==='#admin')return admin();
  if(cur&&users[cur]){home()}
  else landing();
}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')admin();else if(!cur)landing()});
boot();
</script>
